; Display and motion-sensor benchmark on Arduino-ESP32, one env per graphics
; library; each env compiles bench_main.cpp and its env_<library>.cpp.
; Build: pio run -d native/arduino [-e <env>]   Flash: add -t upload --upload-port <port>
[platformio]
default_envs = bench-lovyangfx, bench-tft-espi, bench-lvgl, bench-arduino-gfx

[env]
platform = espressif32@6.13.0
board = ttgo-t-watch
framework = arduino
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
; The watch is ESP32 rev3 (D0WDQ6-V3): no PSRAM cache bug, and the bench needs no PSRAM.
build_unflags = -Os -std=gnu++11 -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw -DBOARD_HAS_PSRAM
build_flags = -std=gnu++17 -O2 -Wall -Wextra
lib_deps =
  symlink://../core
  symlink://../esp32_shared
build_src_filter = -<*> +<bench_main.cpp>

[env:bench-lovyangfx]
build_src_filter = ${env.build_src_filter} +<env_lovyangfx.cpp>
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@1.2.32

; Pins and the run-time clock: include/tft_setup.h (the -I lets the library find it).
[env:bench-tft-espi]
build_src_filter = ${env.build_src_filter} +<env_tft_espi.cpp>
build_flags = ${env.build_flags} -I $PROJECT_INCLUDE_DIR
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI@2.5.43

; LVGL draws and sends each timed frame over LovyanGFX's bus; settings: include/lv_conf.h.
[env:bench-lvgl]
build_src_filter = ${env.build_src_filter} +<env_lvgl.cpp> +<lvgl_drawer.cpp>
build_flags = ${env.build_flags} -I $PROJECT_INCLUDE_DIR -D LV_CONF_INCLUDE_SIMPLE
lib_deps =
  ${env:bench-lovyangfx.lib_deps}
  lvgl/lvgl@9.6.0

[env:bench-arduino-gfx]
build_src_filter = ${env.build_src_filter} +<env_arduino_gfx.cpp>
build_flags = ${env.build_flags} -D ARDUINO_GFX_VERSION=\"1.5.9\"   ; the library has no version macro
lib_deps =
  ${env.lib_deps}
  moononournation/GFX Library for Arduino@1.5.9
