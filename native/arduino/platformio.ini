; Display and motion-sensor benchmark on Arduino-ESP32, one env per graphics
; library; each env compiles bench_main.cpp and its env_<library>.cpp.
; Build: pio run -d native/arduino [-e <env>]   Flash: add -t upload --upload-port <port>
[platformio]
default_envs = bench-lovyangfx

[env]
platform = espressif32@6.13.0
board = ttgo-t-watch
framework = arduino
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
; The watch is ESP32 rev3 (D0WDQ6-V3): no PSRAM cache bug, and the bench needs no PSRAM.
build_unflags = -Os -std=gnu++11 -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw -DBOARD_HAS_PSRAM
build_flags = -std=gnu++17 -O2 -Wall -Wextra
lib_deps =
  symlink://../core
  symlink://../esp32_shared
build_src_filter = -<*> +<bench_main.cpp>

[env:bench-lovyangfx]
build_src_filter = ${env.build_src_filter} +<env_lovyangfx.cpp>
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@1.2.32
