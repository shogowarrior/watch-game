; The game on ESP-IDF: app/runtime.py's loop (hm::runtime::Runtime) over the
; core's drivers, esp_lcd for the panel and ESP-NOW for the beacons.
; Build: pio run -d native/idf/game   Flash: add -t upload --upload-port <port>
[platformio]
default_envs = game

[env:game]
platform = espressif32@6.13.0
board = ttgo-t-watch
framework = espidf
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
; As native/idf: no PSRAM flags, and keep -Os (they reach the bootloader too).
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw -DBOARD_HAS_PSRAM
