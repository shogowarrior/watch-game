; The game on ESP-IDF: app/runtime.py's loop (hm::runtime::Runtime) over the
; core's drivers, esp_lcd for the panel and ESP-NOW for the beacons.
; Build: pio run -d native/idf/game   Flash: add -e game -t upload --upload-port <port>
[platformio]
default_envs = game, game-qemu

[env]
platform = espressif32@6.13.0
board = ttgo-t-watch
framework = espidf
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
; As native/idf: no PSRAM flags, and keep -Os (they reach the bootloader too).
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw -DBOARD_HAS_PSRAM
; A source added to native/core (or another shared component) reaches an existing build.
extra_scripts = pre:../../tools/pio_reconfigure.py

[env:game]

; QEMU only: no radio, and the panel's pixels go nowhere (QEMU has no Wi-Fi
; model and no SPI DMA). python3 native/tools/qemu_run.py native/idf/game --env game-qemu --until "HM fps"
[env:game-qemu]
build_flags = -DHM_QEMU
