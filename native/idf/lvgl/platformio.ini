; LVGL 9 through esp_lvgl_port on ESP-IDF (esp_lcd SPI with DMA): the ripple field as an
; LVGL image, overlays as LVGL widgets. Build: pio run -d native/idf/lvgl
[platformio]
default_envs = bench-lvgl

[env:bench-lvgl]
platform = espressif32@6.13.0
board = ttgo-t-watch
framework = espidf
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw -DBOARD_HAS_PSRAM
; A source added to native/core (or another shared component) reaches an existing build.
extra_scripts = pre:../../tools/pio_reconfigure.py
