; Display and motion-sensor benchmark, ESP-IDF + esp_lcd (SPI with DMA).
; Build: pio run -d native/idf   Flash: add -t upload --upload-port <port>
[platformio]
default_envs = bench-esplcd

[env:bench-esplcd]
platform = espressif32@6.13.0
board = ttgo-t-watch
framework = espidf
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
; The watch is ESP32 rev3 (D0WDQ6-V3): no PSRAM cache bug, and the bench needs no PSRAM.
; Keep -Os: these flags reach the bootloader too, which must stay -Os to fit below 0x8000.
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw -DBOARD_HAS_PSRAM
