; Display and motion-sensor benchmark on ESP-IDF, one environment per way of
; driving the ST7789 (the LVGL build is its own project in lvgl/).
; Build: pio run -d native/idf   Flash: add -e <env> -t upload --upload-port <port>
[platformio]
default_envs = bench-esplcd, bench-regdma

[env]
platform = espressif32@6.13.0
board = ttgo-t-watch
framework = espidf
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
; The watch is ESP32 rev3 (D0WDQ6-V3): no PSRAM cache bug, and the bench needs no PSRAM.
; Keep -Os: these flags reach the bootloader too, which must stay -Os to fit below 0x8000.
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw -DBOARD_HAS_PSRAM

; esp_lcd SPI panel IO, plus the I2C0 check of a faster BMA423 clock
[env:bench-esplcd]
build_flags = -DHM_BUS_CHECK

; SPI2 registers and DMA driven directly
[env:bench-regdma]
build_flags = -DHM_BUS_REGS
